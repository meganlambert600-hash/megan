name: Collect public coupon leads

on:
  schedule:
    # UTC: 01:37 and 09:00 = Beijing 09:37 and 17:00
    - cron: '37 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milk-tea-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      - name: Collect public leads
        run: python scripts/collect.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/offers.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          git commit -m "data: refresh public coupon leads [skip ci]"
          git push
